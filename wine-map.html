<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kev's Cellar | Global Wine Map</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <style>
    #map { height: calc(100vh - 65px); }
    .marker-cluster-small { background-color: rgba(190, 18, 60, 0.6); }
    .marker-cluster-small div { background-color: rgba(159, 18, 57, 0.9); color: #fff; font-weight: bold; }
    .marker-cluster-medium { background-color: rgba(159, 18, 57, 0.6); }
    .marker-cluster-medium div { background-color: rgba(136, 19, 55, 0.9); color: #fff; font-weight: bold; }
    .marker-cluster-large { background-color: rgba(136, 19, 55, 0.6); }
    .marker-cluster-large div { background-color: rgba(76, 5, 25, 0.9); color: #fff; font-weight: bold; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100">

  <header class="border-b border-slate-800 bg-slate-900/90 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <a href="index.html" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg transition text-xs flex items-center gap-2">
        <i class="fa-solid fa-arrow-left"></i> Back to Inventory
      </a>
      <h1 class="text-base font-bold text-white">Global Cellar Map</h1>
    </div>
  </header>

  <div id="map"></div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const map = L.map('map').setView([20, 0], 2);

      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CARTO',
        maxZoom: 19
      }).addTo(map);

      const markers = L.markerClusterGroup({
        showCoverageOnHover: false,
        maxClusterRadius: 40
      });

      let wines = [];
      const stored = localStorage.getItem('kevs_cellar_inventory');
      if (stored) {
        wines = JSON.parse(stored);
      } else {
        try {
          const res = await fetch('wines.json');
          wines = await res.json();
        } catch(e) {
          console.error("Failed to load map inventory data:", e);
        }
      }

      wines.forEach(wine => {
        if (wine.coordinates && wine.coordinates.lat && wine.coordinates.lng) {
          const marker = L.marker([wine.coordinates.lat, wine.coordinates.lng]);
          marker.bindPopup(`
            <div class="text-slate-900 p-1">
              <strong class="text-sm font-bold block">${wine.vintage} ${wine.name}</strong>
              <span class="text-xs text-slate-600 block">${wine.region}, ${wine.country}</span>
              <span class="text-xs text-rose-700 font-bold block mt-1">${wine.quantity} bottle(s) in inventory</span>
            </div>
          `);
          markers.addLayer(marker);
        }
      });

      map.addLayer(markers);
    });
  </script>
</body>
</html>
